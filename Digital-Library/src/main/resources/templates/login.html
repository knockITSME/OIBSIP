<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        nav {
            background: #1e3a5f;
            padding: 18px 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 70px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #142b46;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #1e3a5f;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Digital Library</a>
</nav>

<div class="container">

    <div class="form-card">

        <h1>Login</h1>

        <form id="loginForm">

            <label>Email</label>

            <input
                    type="email"
                    id="email"
                    required
                    placeholder="Enter your email">

            <label>Password</label>

            <input
                    type="password"
                    id="password"
                    required
                    placeholder="Enter your password">

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

    </div>

</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch(
            `/api/auth/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
            {
                method: "POST"
            }
        );

        const result = await response.text();

        const message = document.getElementById("message");

        if (response.ok) {
            message.style.color = "green";
            message.textContent = result;

            // Temporary redirect
            setTimeout(() => {
                window.location.href = "/books";
            }, 800);
        } else {
            message.style.color = "red";
            message.textContent = result;
        }
    });
</script>

</body>
</html>
