<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 32px;
            color: #2563eb;
        }

        .stat-card p {
            margin-bottom: 0;
            color: #666;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .button {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .logout {
            background: #dc2626;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .logout:hover {
            background: #b91c1c;
        }

        #message {
            font-weight: bold;
            margin: 15px 0;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

    </style>

</head>

<body>

<header>

    <h1>Digital Library - Admin</h1>

    <nav>

        <a href="/books">Books</a>

        <a href="/dashboard">User Dashboard</a>

        <button class="logout"
                onclick="logout()">
            Logout
        </button>

    </nav>

</header>


<div class="container">


    <div class="welcome">

        <h2>Admin Dashboard</h2>

        <p id="adminInfo">
            Checking admin login...
        </p>

    </div>


    <div id="message"></div>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">

            <h3 id="bookCount">
                0
            </h3>

            <p>Total Books</p>

        </div>


        <div class="stat-card">

            <h3 id="userCount">
                0
            </h3>

            <p>Total Members</p>

        </div>


        <div class="stat-card">

            <h3 id="issuedCount">
                0
            </h3>

            <p>Issued Books</p>

        </div>


        <div class="stat-card">

            <h3 id="fineCount">
                ₹0
            </h3>

            <p>Unpaid Fines</p>

        </div>

    </div>


    <!-- Admin actions -->

    <div class="section">

        <h2>Administration</h2>

        <a href="/admin/books"
           class="button">
            Manage Books
        </a>

        <a href="/admin/members"
           class="button">
            Manage Members
        </a>

        <a href="/admin/borrowed"
           class="button">
            Issued Books
        </a>

        <a href="/admin/queries"
           class="button">
            Contact Queries
        </a>

    </div>


    <!-- Borrowed books -->

    <div class="section">

        <h2>Recently Issued Books</h2>

        <div id="borrowContainer">

            <div class="loading">
                Loading issued books...
            </div>

        </div>

    </div>


</div>


<script>


    /*
     * Check logged-in user
     */

    async function loadAdmin() {

        try {

            const response =
                await fetch("/api/auth/me");

            if (!response.ok) {

                window.location.href = "/login";

                return;
            }

            const user =
                await response.json();


            /*
             * Make sure user is actually an ADMIN
             */

            if (user.role !== "ADMIN") {

                document.getElementById("adminInfo")
                    .innerText =
                    "Access denied. Admin privileges required.";

                document.getElementById("message")
                    .innerText =
                    "You are not authorized to access the Admin Dashboard.";

                return;
            }


            document.getElementById("adminInfo")
                .innerText =
                "Welcome, " +
                user.name +
                " (" +
                user.email +
                ")";


            loadBooks();
            loadUsers();
            loadBorrowRecords();

        } catch (error) {

            console.error(error);

            document.getElementById("adminInfo")
                .innerText =
                "Unable to verify admin login.";

        }

    }


    /*
     * Load books
     */

    async function loadBooks() {

        try {

            const response =
                await fetch("/api/books");

            const books =
                await response.json();

            document.getElementById("bookCount")
                .innerText =
                books.length;

        } catch (error) {

            console.error(error);

        }

    }


    /*
     * Load members
     */

    async function loadUsers() {

        try {

            const response =
                await fetch("/api/users");

            if (!response.ok) {

                console.error(
                    "Unable to load users"
                );

                return;
            }

            const users =
                await response.json();

            document.getElementById("userCount")
                .innerText =
                users.length;

        } catch (error) {

            console.error(error);

        }

    }


    /*
     * Load borrow records
     */

    async function loadBorrowRecords() {

        try {

            const response =
                await fetch("/api/borrow");

            const records =
                await response.json();


            /*
             * Count active issued books
             */

            const activeRecords =
                records.filter(
                    record => !record.returned
                );

            document.getElementById("issuedCount")
                .innerText =
                activeRecords.length;


            /*
             * Calculate unpaid fines
             */

            let unpaidFine = 0;

            records.forEach(record => {

                if (
                    record.fine > 0 &&
                    !record.finePaid
                ) {

                    unpaidFine += record.fine;

                }

            });


            document.getElementById("fineCount")
                .innerText =
                "₹" + unpaidFine;


            displayBorrowRecords(records);

        } catch (error) {

            console.error(error);

            document.getElementById(
                "borrowContainer"
            ).innerText =
                "Unable to load issued books.";

        }

    }


    /*
     * Display borrow records
     */

    function displayBorrowRecords(records) {

        const container =
            document.getElementById(
                "borrowContainer"
            );


        if (records.length === 0) {

            container.innerHTML =
                "<p>No borrow records found.</p>";

            return;
        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>User</th>

                        <th>Book</th>

                        <th>Issue Date</th>

                        <th>Due Date</th>

                        <th>Status</th>

                        <th>Fine</th>

                    </tr>

                </thead>

                <tbody>

        `;


        records.forEach(record => {

            html += `

                <tr>

                    <td>
                        ${record.user.name}
                    </td>

                    <td>
                        ${record.book.title}
                    </td>

                    <td>
                        ${record.issueDate}
                    </td>

                    <td>
                        ${record.dueDate}
                    </td>

                    <td>
                        ${
                            record.returned
                            ? "Returned"
                            : "Issued"
                        }
                    </td>

                    <td>
                        ₹${record.fine}
                        ${
                            record.fine > 0
                            ? (
                                record.finePaid
                                ? " (Paid)"
                                : " (Unpaid)"
                              )
                            : ""
                        }
                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        container.innerHTML = html;

    }


    /*
     * Logout
     */

    async function logout() {

        try {

            await fetch(
                "/api/auth/logout",
                {
                    method: "POST"
                }
            );

            window.location.href = "/login";

        } catch (error) {

            console.error(error);

        }

    }


    /*
     * Start
     */

    loadAdmin();

</script>

</body>

</html>
