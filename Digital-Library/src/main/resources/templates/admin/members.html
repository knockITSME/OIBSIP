<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Members - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button, a {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back {
            background: #3b82f6;
            color: white;
        }

        .logout {
            background: #ef4444;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .role {
            font-weight: bold;
        }

        .admin {
            color: #dc2626;
        }

        .user {
            color: #2563eb;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            table {
                font-size: 13px;
            }

            th, td {
                padding: 9px;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Manage Members</h1>

    <div class="header-buttons">
        <a href="/admin" class="back">Admin Dashboard</a>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div id="message" class="message"></div>

    <div class="card">

        <h2>Registered Members</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="membersTable">
            </tbody>
        </table>

    </div>

</div>

<script>

    let currentUser = null;

    async function checkAdmin() {

        try {

            const response = await fetch('/api/auth/me');

            if (!response.ok) {
                window.location.href = '/login';
                return false;
            }

            currentUser = await response.json();

            if (currentUser.role !== 'ADMIN') {
                alert('Access denied. Admins only.');
                window.location.href = '/books';
                return false;
            }

            return true;

        } catch (error) {

            console.error(error);
            window.location.href = '/login';
            return false;
        }
    }


    async function loadMembers() {

        const response = await fetch('/api/users');

        if (!response.ok) {
            showMessage('Unable to load members.', 'error');
            return;
        }

        const users = await response.json();

        const table = document.getElementById('membersTable');

        table.innerHTML = '';

        users.forEach(user => {

            const row = document.createElement('tr');

            const roleClass =
                user.role === 'ADMIN' ? 'admin' : 'user';

            let action = '';

            if (user.role === 'ADMIN') {

                action = '<span>Protected</span>';

            } else {

                action = `
                    <button
                        class="delete-btn"
                        onclick="deleteMember(${user.id})">
                        Delete
                    </button>
                `;
            }

            row.innerHTML = `
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td class="role ${roleClass}">
                    ${user.role}
                </td>
                <td>${action}</td>
            `;

            table.appendChild(row);
        });
    }


    async function deleteMember(id) {

        const confirmed =
            confirm('Are you sure you want to delete this member?');

        if (!confirmed) {
            return;
        }

        try {

            const response =
                await fetch(`/api/users/${id}`, {
                    method: 'DELETE'
                });

            if (!response.ok) {
                throw new Error('Delete failed');
            }

            showMessage(
                'Member deleted successfully.',
                'success'
            );

            loadMembers();

        } catch (error) {

            console.error(error);

            showMessage(
                'Unable to delete member.',
                'error'
            );
        }
    }


    function showMessage(text, type) {

        const message =
            document.getElementById('message');

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display = 'block';

        setTimeout(() => {
            message.style.display = 'none';
        }, 3000);
    }


    async function logout() {

        await fetch('/api/auth/logout', {
            method: 'POST'
        });

        window.location.href = '/login';
    }


    async function initialize() {

        const isAdmin = await checkAdmin();

        if (isAdmin) {
            loadMembers();
        }
    }


    initialize();

</script>

</body>
</html>
