<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issued Books - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button,
        a {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back {
            background: #3b82f6;
            color: white;
        }

        .logout {
            background: #ef4444;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .active {
            color: #dc2626;
            font-weight: bold;
        }

        .returned {
            color: #16a34a;
            font-weight: bold;
        }

        .paid {
            color: #16a34a;
            font-weight: bold;
        }

        .unpaid {
            color: #dc2626;
            font-weight: bold;
        }

        .pay-btn {
            background: #16a34a;
            color: white;
        }

        .pay-btn:hover {
            background: #15803d;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

<header>

    <h1>Issued Books & Fines</h1>

    <div class="header-buttons">

        <a href="/admin" class="back">
            Admin Dashboard
        </a>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div id="message" class="message"></div>

    <div class="card">

        <h2>Borrow Records</h2>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Email</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Status</th>
                <th>Fine</th>
                <th>Fine Status</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="borrowTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    let currentUser = null;


    async function checkAdmin() {

        try {

            const response = await fetch('/api/auth/me');

            if (!response.ok) {

                window.location.href = '/login';

                return false;
            }

            currentUser = await response.json();

            if (currentUser.role !== 'ADMIN') {

                alert('Access denied. Admins only.');

                window.location.href = '/books';

                return false;
            }

            return true;

        } catch (error) {

            console.error(error);

            window.location.href = '/login';

            return false;
        }
    }


    async function loadBorrowRecords() {

        try {

            const response =
                await fetch('/api/borrow');

            if (!response.ok) {

                throw new Error(
                    'Unable to load borrow records'
                );
            }

            const records =
                await response.json();

            const table =
                document.getElementById('borrowTable');

            table.innerHTML = '';


            if (records.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="11"
                            style="text-align:center;">
                            No borrow records found.
                        </td>
                    </tr>
                `;

                return;
            }


            records.forEach(record => {

                const row =
                    document.createElement('tr');


                const userName =
                    record.user
                        ? record.user.name
                        : 'Unknown';

                const userEmail =
                    record.user
                        ? record.user.email
                        : 'Unknown';

                const bookTitle =
                    record.book
                        ? record.book.title
                        : 'Unknown';


                const status =
                    record.returned
                        ? `<span class="returned">Returned</span>`
                        : `<span class="active">Issued</span>`;


                const fine =
                    record.fine || 0;


                let fineStatus = '—';

                if (fine > 0) {

                    if (record.finePaid) {

                        fineStatus =
                            `<span class="paid">Paid</span>`;

                    } else {

                        fineStatus =
                            `<span class="unpaid">Unpaid</span>`;
                    }
                }


                let action = '—';


                if (fine > 0 && !record.finePaid) {

                    action = `
                        <button
                            class="pay-btn"
                            onclick="markFinePaid(${record.id})">
                            Mark Paid
                        </button>
                    `;
                }


                row.innerHTML = `

                    <td>${record.id}</td>

                    <td>${userName}</td>

                    <td>${userEmail}</td>

                    <td>${bookTitle}</td>

                    <td>${record.issueDate || '—'}</td>

                    <td>${record.dueDate || '—'}</td>

                    <td>${record.returnDate || '—'}</td>

                    <td>${status}</td>

                    <td>₹${fine}</td>

                    <td>${fineStatus}</td>

                    <td>${action}</td>

                `;


                table.appendChild(row);

            });


        } catch (error) {

            console.error(error);

            showMessage(
                'Unable to load borrow records.',
                'error'
            );
        }
    }


    async function markFinePaid(id) {

        const confirmed =
            confirm(
                'Mark this fine as paid?'
            );

        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/borrow/fine-paid/${id}`,
                    {
                        method: 'PUT'
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Unable to mark fine as paid'
                );
            }


            showMessage(
                'Fine marked as paid successfully.',
                'success'
            );


            loadBorrowRecords();


        } catch (error) {

            console.error(error);

            showMessage(
                'Unable to mark fine as paid.',
                'error'
            );
        }
    }


    function showMessage(text, type) {

        const message =
            document.getElementById('message');

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display =
            'block';


        setTimeout(() => {

            message.style.display =
                'none';

        }, 3000);
    }


    async function logout() {

        await fetch(
            '/api/auth/logout',
            {
                method: 'POST'
            }
        );

        window.location.href =
            '/login';
    }


    async function initialize() {

        const isAdmin =
            await checkAdmin();

        if (isAdmin) {

            loadBorrowRecords();
        }
    }


    initialize();

</script>

</body>
</html>
