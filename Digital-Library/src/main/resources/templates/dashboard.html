<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        nav {
            background: #1e3a5f;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        nav .links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            width: 1100px;
            max-width: 92%;
            margin: 40px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-top: 0;
            color: #1e3a5f;
        }

        .welcome p {
            color: #555;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #1e3a5f;
            margin: 0 0 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .section h2 {
            color: #1e3a5f;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f4f7fb;
            color: #1e3a5f;
        }

        .return-btn {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
        }

        .return-btn:hover {
            background: #142b46;
        }

        .status {
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 18px 20px;
            }

            nav .links {
                gap: 10px;
            }

            table {
                font-size: 13px;
            }

        }

    </style>
</head>

<body>

<nav>

    <a href="/" class="logo">
        Digital Library
    </a>

    <div class="links">
        <a href="/books">Browse Books</a>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

</nav>

<div class="container">

    <div class="welcome">

        <h1>
            Welcome, <span id="userName">User</span> 👋
        </h1>

        <p>
            Email:
            <strong id="userEmail"></strong>
        </p>

    </div>

    <div class="cards">

        <div class="card">
            <h2>Issued Books</h2>
            <p id="issuedCount">0</p>
        </div>

        <div class="card">
            <h2>Active Bookings</h2>
            <p id="bookingCount">0</p>
        </div>

        <div class="card">
            <h2>Total Fine</h2>
            <p>₹<span id="fineAmount">0</span></p>
        </div>

    </div>

    <div class="section">

        <h2>My Issued Books</h2>

        <table>

            <thead>

            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Issue Date</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="borrowTable">

            </tbody>

        </table>

        <div id="message" class="message"></div>

    </div>

</div>

<script>

    async function loadDashboard() {

        try {

            const userResponse = await fetch("/api/auth/me");

            if (!userResponse.ok) {
                window.location.href = "/login";
                return;
            }

            const user = await userResponse.json();

            document.getElementById("userName").innerText = user.name;
            document.getElementById("userEmail").innerText = user.email;

            const borrowResponse =
                await fetch("/api/borrow/user/" + user.id);

            if (!borrowResponse.ok) {
                throw new Error("Unable to load borrow records");
            }

            const records = await borrowResponse.json();

            const activeRecords =
                records.filter(record => !record.returned);

            document.getElementById("issuedCount").innerText =
                activeRecords.length;

            let totalFine = 0;

            records.forEach(record => {

                if (record.fine && !record.finePaid) {
                    totalFine += record.fine;
                }

            });

            document.getElementById("fineAmount").innerText =
                totalFine;

            const table =
                document.getElementById("borrowTable");

            table.innerHTML = "";

            if (records.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6">
                            No borrow records found.
                        </td>
                    </tr>
                `;

                return;
            }

            records.forEach(record => {

                const row = document.createElement("tr");

                const returnedText =
                    record.returned ? "Returned" : "Issued";

                const action =
                    record.returned
                        ? "-"
                        : `<button class="return-btn"
                             onclick="returnBook(${record.id})">
                             Return
                           </button>`;

                row.innerHTML = `
                    <td>${record.book.title}</td>
                    <td>${record.book.author}</td>
                    <td>${record.issueDate}</td>
                    <td>${record.dueDate}</td>
                    <td class="status">${returnedText}</td>
                    <td>${action}</td>
                `;

                table.appendChild(row);

            });

        } catch (error) {

            console.error(error);

            document.getElementById("message").innerText =
                "Unable to load dashboard.";

        }

    }


    async function returnBook(borrowId) {

        try {

            const response =
                await fetch("/api/borrow/return/" + borrowId, {
                    method: "PUT"
                });

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(errorText);
            }

            document.getElementById("message").innerText =
                "Book returned successfully.";

            loadDashboard();

        } catch (error) {

            document.getElementById("message").innerText =
                error.message;

        }

    }


    async function logout() {

        await fetch("/api/auth/logout", {
            method: "POST"
        });

        window.location.href = "/login";

    }


    loadDashboard();

</script>5

</body>
</html>
