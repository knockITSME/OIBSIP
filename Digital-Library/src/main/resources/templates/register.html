<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        nav {
            background: #1e3a5f;
            padding: 18px 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #142b46;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1e3a5f;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Digital Library</a>
</nav>

<div class="container">

    <div class="form-card">

        <h1>Create Account</h1>

        <form id="registerForm">

            <label>Name</label>
            <input
                    type="text"
                    id="name"
                    required
                    placeholder="Enter your name">

            <label>Email</label>
            <input
                    type="email"
                    id="email"
                    required
                    placeholder="Enter your email">

            <label>Password</label>
            <input
                    type="password"
                    id="password"
                    required
                    placeholder="Enter your password">

            <button type="submit">
                Register
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</div>

<script>

    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const user = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: "USER"
            };

            fetch("/api/users/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            })
            .then(response => {

                if (!response.ok) {
                    throw new Error("Registration failed");
                }

                return response.json();

            })
            .then(data => {

                document.getElementById("message").innerText =
                    "Registration successful! Redirecting to login...";

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);

            })
            .catch(error => {

                document.getElementById("message").innerText =
                    error.message;

            });

        });

</script>

</body>
</html>
